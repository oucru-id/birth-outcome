name: Unpack Purbalingga package

on:
  push:
    branches:
      - add-purbalingga-production-sql
    paths:
      - 'Purbalingga/Purbalingga_GitHub_redacted.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Expand package into Purbalingga folder
        shell: bash
        run: |
          set -euo pipefail
          ZIP='Purbalingga/Purbalingga_GitHub_redacted.zip'
          if [ ! -f "$ZIP" ]; then
            echo 'Archive already removed; nothing to do.'
            exit 0
          fi
          rm -rf /tmp/purbalingga_unpack
          mkdir -p /tmp/purbalingga_unpack
          unzip -q "$ZIP" -d /tmp/purbalingga_unpack
          mkdir -p Purbalingga
          cp -a /tmp/purbalingga_unpack/Purbalingga_GitHub/. Purbalingga/
          rm -f "$ZIP"

      - name: Commit expanded files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Purbalingga
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Expand Purbalingga production SQL package'
          git push
